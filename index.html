<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="description" content="物品管家：管理家中物品的分类、存放位置与保质期，自动标记临期与过期并提醒。数据仅保存在本机。">
<meta name="theme-color" content="#6f7f58">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="物品管家">
<title>物品管家</title>
<script>
/* 提前应用主题，避免闪白 */
try {
  var _d = JSON.parse(localStorage.getItem('wupin-guanjia-v1') || 'null');
  var _t = (_d && _d.settings && _d.settings.theme) || 'auto';
  var _dark = _t === 'dark' || (_t === 'auto' && matchMedia('(prefers-color-scheme: dark)').matches);
  document.documentElement.dataset.theme = _dark ? 'dark' : 'light';
} catch (e) {}
</script>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app">
  <aside id="sidebar">
    <div class="logo">📦 物品管家</div>
    <nav id="nav"></nav>
    <div class="side-foot">数据保存在本机，不上传</div>
  </aside>
  <div id="content">
    <header id="topbar">
      <div class="topbar-inner">
        <div id="page-title">概览</div>
        <div class="top-actions">
          <button class="icon-btn" id="bell-btn" data-action="goto-attention" title="查看需关注的物品">🔔<span id="bell-badge" class="badge hidden"></span></button>
          <button class="btn primary" id="add-btn" data-action="add-item">＋ 添加物品</button>
        </div>
      </div>
    </header>
    <main id="main"></main>
  </div>
</div>
<nav id="bottomnav"></nav>
<button id="fab" data-action="add-item" aria-label="添加物品">＋</button>
<div id="modal-root"></div>
<div id="toast-root"></div>
<noscript>需要启用 JavaScript 才能使用物品管家。</noscript>
<script src="app.js"></script>
</body>
</html>
